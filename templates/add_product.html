{% extends "base.html" %}
{% block title %}Add Product - myDuka{% endblock %}
{% block content %}
    <h1>Add New Product</h1>
    <p>Fill in the details below to add a product to your shop.</p>

    <form method="POST" action="/products/add" class="mt-3" style="max-width: 500px;">
        <div class="mb-3">
            <label for="name" class="form-label">Product Name</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Enter product name" required>
        </div>
        <div class="mb-3">
            <label for="buying_price" class="form-label">Buying Price (KSh)</label>
            <input type="number" step="0.01" class="form-control" id="buying_price" name="buying_price" placeholder="Enter buying price" required>
        </div>
        <div class="mb-3">
            <label for="selling_price" class="form-label">Selling Price (KSh)</label>
            <input type="number" step="0.01" class="form-control" id="selling_price" name="selling_price" placeholder="Enter selling price" required>
        </div>
        <button type="submit" class="btn btn-primary">Save Product</button>
        <a href="/products" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
{% endblock %}
