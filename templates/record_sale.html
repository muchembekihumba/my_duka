{% extends "base.html" %}
{% block title %}Record Sale - myDuka{% endblock %}
{% block content %}
    <h1>Record New Sale</h1>
    <p>Add one or more products to this sale.</p>

    <form method="POST" action="/sales/new">
        <table class="table table-bordered" id="saleTable">
            <thead class="table-dark">
                <tr>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="saleRows">
                <tr>
                    <td>
                        <select name="pid" class="form-select" required>
                            <option value="" disabled selected>Select product</option>
                            {% for product in products %}
                            <option value="{{ product[0] }}">{{ product[1] }}</option>
                            {% endfor %}
                        </select>
                    </td>
                    <td>
                        <input type="number" name="quantity" class="form-control" min="1" placeholder="Qty" required>
                    </td>
                    <td>
                        <button type="button" class="btn btn-danger btn-sm remove-row">Remove</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <button type="button" class="btn btn-secondary mb-3" id="addRow">+ Add Product</button>
        <br>
        <button type="submit" class="btn btn-primary">Save Sale</button>
        <a href="/sales" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
{% endblock %}

{% block scripts %}
<script>
    const productOptions = `{% for product in products %}<option value="{{ product[0] }}">{{ product[1] }}</option>{% endfor %}`;

    document.getElementById('addRow').addEventListener('click', function () {
        const tbody = document.getElementById('saleRows');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>
                <select name="pid" class="form-select" required>
                    <option value="" disabled selected>Select product</option>
                    ${productOptions}
                </select>
            </td>
            <td>
                <input type="number" name="quantity" class="form-control" min="1" placeholder="Qty" required>
            </td>
            <td>
                <button type="button" class="btn btn-danger btn-sm remove-row">Remove</button>
            </td>`;
        tbody.appendChild(row);
    });

    document.getElementById('saleRows').addEventListener('click', function (e) {
        if (e.target.classList.contains('remove-row')) {
            const rows = document.querySelectorAll('#saleRows tr');
            if (rows.length > 1) {
                e.target.closest('tr').remove();
            }
        }
    });
</script>
{% endblock %}
