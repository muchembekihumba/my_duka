{% extends "base.html" %}
{% block title %}Register - myDuka{% endblock %}
{% block content %}
    <h1>Create an Account</h1>
    <p>Register to start managing your shop.</p>
    <form method="POST" action="/register">
        <label for="username">Username</label><br>
        <input type="text" id="username" name="username" placeholder="Choose a username" required><br><br>
        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
        <label for="password">Password</label><br>
        <input type="password" id="password" name="password" placeholder="Choose a password" required><br><br>
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="/login">Login here</a></p>
{% endblock %}
